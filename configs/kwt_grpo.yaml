# Overrides on top of Tunix's cli/base_config.yaml for the text-mode GRPO demo.
# Sized for one spot v5e chip (v5litepod-1, 16 GB HBM). The CPU smoke test and
# bigger slices override model/mesh/steps on the command line (see kwt/grpo.py).

model_config:
  model_name: "qwen3-1.7b"
  model_id: "Qwen/Qwen3-1.7B"
  model_source: "huggingface"
  model_download_path: "/tmp/models"
  load_dtype: "bfloat16"
  remat_config: 3  # remat whole decoder layers
  rng_seed: 0
  model_display: false
  lora_config:
    module_path: ".*q_proj|.*k_proj|.*v_proj|.*o_proj|.*gate_proj|.*up_proj|.*down_proj"
    rank: 16
    alpha: 32.0
  mesh:
    shape: "(1,1)"
    axis_names: "('fsdp','tp')"

# actor/reference/rollout configs inherit model_config (Tunix CLI rule).
# kwt.grpo.build() makes reference/rollout share the actor mesh (one chip).

tokenizer_config:
  tokenizer_path: "Qwen/Qwen3-1.7B"
  tokenizer_type: "huggingface"
  add_bos: false
  add_eos: false

data_module: "kwt.tasks"  # create_dataset() defaults to the train split
apply_chat_template_to_dataset: false  # kwt.tasks renders Qwen3 no-think prompts
batch_size: 4
num_batches: 0
num_train_epochs: 1

rl_training_config:
  eval_every_n_steps: 1000000
  max_steps: 200
  gradient_accumulation_steps: null  # RL derives it from mini/micro batch sizes
  # One chip (15.75 GB HBM): train / score one prompt group (8 rollouts) at a
  # time and chunk the vocab-wide logprob computation. The first launch OOMed
  # by 1.1 GB without these.
  mini_batch_size: 4
  train_micro_batch_size: 1
  rollout_micro_batch_size: 1  # decode one group of 8 at a time (4.6 GB OOM at 4)
  compute_logps_micro_batch_size: 1
  compute_logps_chunk_size: 64
  checkpoint_root_directory: "/tmp/kwt/ckpt"
  checkpointing_options:
    max_to_keep: 2
    save_interval_steps: 25
  metrics_logging_options:
    log_dir: "/tmp/kwt/logs"
    flush_every_n_steps: 1
  actor_optimizer_config:
    opt_type: "adamw"
    learning_rate: 3e-5  # LoRA: 3e-6 (run 2) moved weights only ~0.5%
    schedule_type: "warmup_cosine_decay_schedule"
    init_value: 0.0
    peak_value: 3e-5
    end_value: 3e-6
    warmup_ratio: 0.05
    warmup_steps: 10
    decay_steps: 200
    b1: 0.9
    b2: 0.99
    weight_decay: 0.0
    max_grad_norm: 1.0

grpo_config:
  num_generations: 8
  num_iterations: 1
  beta: 0.02
  epsilon: 0.2

rollout_config:
  total_generation_steps: 320
  kv_cache_size: 704  # prompt 320 + generation 320 + 64 (default pads +256)
  max_prompt_length: 320
  temperature: 1.0
  top_p: 1.0
  top_k: 50

rollout_engine: "vanilla"
offload_to_cpu: false
verl_compatible: false
reward_functions:
  - "kwt.rewards"
